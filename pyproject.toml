[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proteinanomaly"
version = "0.1.0"
description = "Diagnostic tool for quantifying decoy artificial-enrichment bias (physicochemical, scaffold, AVE) in virtual screening benchmarks (DUD-E, LIT-PCBA, PDBbind)."
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2023.9",
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
